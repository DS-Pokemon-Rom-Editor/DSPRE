name: DSPRE Canary Build

on:
  push:
    branches:
      - main  # Trigger only on pushes to the main branch

permissions:
  contents: write
  actions: write

env:
  BUILD_CONFIGURATION: Release

jobs:
  build-linux:
    if: github.repository == 'DS-Pokemon-Rom-Editor/DSPRE'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        # Avalonia 12 needs a newer compiler than SDK 8 has; the 8 runtime runs the net8.0 app and tests.
        dotnet-version: |
          8.0.x
          10.0.x

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Clone Database Repository
      run: git clone https://github.com/DS-Pokemon-Rom-Editor/scrcmd-database.git databases

    - name: Clone ds-rom Repository
      run: git clone --depth 1 https://github.com/DS-Pokemon-Rom-Editor/ds-rom.git ds-rom

    - name: Publish DSPRE.Avalonia (linux-x64)
      run: dotnet publish DSPRE.Avalonia/DSPRE.Avalonia.csproj -c Release -r linux-x64 --self-contained true -o publish-linux

    - name: Build dsrom (Linux)
      run: |
        cargo build --release -p ds-rom-cli --manifest-path ds-rom/Cargo.toml
        mkdir -p publish-linux/Tools
        cp ds-rom/target/release/dsrom publish-linux/Tools/dsrom
        chmod +x publish-linux/Tools/dsrom

    - name: Build apicula (Linux)
      uses: ./.github/actions/build-apicula
      with:
        output-directory: publish-linux/Tools

    - name: Build rotom (Linux)
      uses: ./.github/actions/build-rotom
      with:
        output-directory: publish-linux/Tools

    - name: Build chatot
      uses: ./.github/actions/build-chatot
      with:
        output-directory: publish-linux/Tools

    # TODO: drop the remaining Linux tool binaries into publish-linux/Tools/ with these exact
    # names (no extension): ndstool, blz.
    # ndstool + blz build from source (devkitPro / CUE tools).

    - name: Bundle Databases
      run: |
        mkdir -p publish-linux/databases
        rsync -a --exclude='.git' --exclude='.github' --exclude='.gitmodules' databases/ publish-linux/databases/

    - name: Archive Linux build
      run: tar -C publish-linux -czf DSPRE-linux-x64-canary.tar.gz .

    - name: Upload Linux artifact
      uses: actions/upload-artifact@v4
      with:
        name: dspre-linux-x64
        path: DSPRE-linux-x64-canary.tar.gz

  build:
    if: github.repository == 'DS-Pokemon-Rom-Editor/DSPRE'
    needs: build-linux
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v2

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        # Avalonia 12 needs a newer compiler than SDK 8 has; the 8 runtime runs the net8.0 app and tests.
        dotnet-version: |
          8.0.x
          10.0.x

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      
    - name: Clone Database Repository
      run: |
        git clone https://github.com/DS-Pokemon-Rom-Editor/scrcmd-database.git databases

    - name: Clone ds-rom Repository
      run: |
        git clone --depth 1 https://github.com/DS-Pokemon-Rom-Editor/ds-rom.git ds-rom
        
    - name: Publish DSPRE (win-x64)
      run: |
        dotnet publish DSPRE.Avalonia/DSPRE.Avalonia.csproj -p:PublishProfile=win-x64 -o publish-win
        # Installed copies update through DSPRE.exe; the launcher still finds DSPRE.Avalonia.dll by name.
        Rename-Item -Path publish-win/DSPRE.Avalonia.exe -NewName DSPRE.exe
    
    - name: Build dsrom.exe
      run: |
        cargo build --release -p ds-rom-cli --manifest-path ds-rom/Cargo.toml
        New-Item -ItemType Directory -Force -Path "${{ github.workspace }}\publish-win\Tools" | Out-Null
        Copy-Item -Path "${{ github.workspace }}\ds-rom\target\release\dsrom.exe" -Destination "${{ github.workspace }}\publish-win\Tools\dsrom.exe" -Force

    - name: Build apicula.exe
      uses: ./.github/actions/build-apicula
      with:
        output-directory: publish-win/Tools

    - name: Build rotom.exe
      uses: ./.github/actions/build-rotom
      with:
        output-directory: publish-win/Tools

    - name: Build chatot
      uses: ./.github/actions/build-chatot
      with:
        output-directory: publish-win/Tools
    
    - name: Prepare Release Files
      run: |
        mkdir "${{ github.workspace }}\publish-win\databases"
        robocopy databases "${{ github.workspace }}\publish-win\databases" /E /XD .git .github /XF .gitmodules
        if ($LASTEXITCODE -le 7) { exit 0 } else { exit 1 }

    - name: Zip Release Files
      run: Compress-Archive -Path "${{ github.workspace }}\publish-win\*" -DestinationPath DSPRE-canary-${{ github.sha }}.zip

    - name: Download Linux artifact
      uses: actions/download-artifact@v4
      with:
        name: dspre-linux-x64

    - name: Fetch tags
      run: git fetch --prune --unshallow --tags

    - name: Delete previous release
      run: |
        gh release delete --yes canary || true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Update canary tag
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git tag -f canary -m "Canary build for commit ${{ github.sha }}"
        git push -f origin canary
    
    - name: Get current date
      id: date
      run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT
        
    - name: Create new release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: canary
        name: DSPRE Canary Build ${{ steps.date.outputs.date }} (${{ github.sha }})
        files: |
          DSPRE-canary-${{ github.sha }}.zip
          DSPRE-linux-x64-canary.tar.gz
        token: ${{ secrets.GITHUB_TOKEN }}
        body: |
          ##  ⚠️ Canary Build Notice ⚠️
          This is a Canary Build of DSPRE, meaning it is automatically generated from the latest pushed code. It includes the most recent changes, improvements, and experimental features, but may be unstable or contain bugs.
          
          ## 🚧 What does this mean?
          This build reflects ongoing development and is not a stable release.
          Features may be incomplete, subject to change, or cause unexpected issues.
          Use at your own risk: expect potential crashes, broken functionality, or unpolished features.
          
          ## 💡 Who is this for?
          Developers and testers who want to stay up-to-date with the latest progress.
          Users willing to report issues and provide feedback on new changes.
          If you’re looking for a more reliable version, consider using the latest Stable Release instead.
        prerelease: true
        generate_release_notes: true
