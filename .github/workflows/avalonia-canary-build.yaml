name: DSPRE Avalonia Canary Build

on:
  push:
    branches:
      - feature/avalonia
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build-windows:
    if: github.repository == 'DS-Pokemon-Rom-Editor/DSPRE'
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          # Avalonia 12 needs a newer compiler than SDK 8 has; the 8 runtime runs the net8.0 app and tests.
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Clone Database Repository
        run: git clone https://github.com/DS-Pokemon-Rom-Editor/scrcmd-database.git databases

      - name: Clone ds-rom Repository
        run: git clone --depth 1 https://github.com/DS-Pokemon-Rom-Editor/ds-rom.git ds-rom

      - name: Publish DSPRE.Avalonia (win-x64)
        run: dotnet publish DSPRE.Avalonia/DSPRE.Avalonia.csproj -p:PublishProfile=win-x64

      - name: Build dsrom.exe
        run: |
          cargo build --release -p ds-rom-cli --manifest-path ds-rom/Cargo.toml
          New-Item -ItemType Directory -Force -Path "DSPRE.Avalonia/bin/publish/win-x64/Tools" | Out-Null
          Copy-Item -Path "ds-rom/target/release/dsrom.exe" -Destination "DSPRE.Avalonia/bin/publish/win-x64/Tools/dsrom.exe" -Force

      - name: Build apicula.exe
        uses: ./.github/actions/build-apicula
        with:
          output-directory: DSPRE.Avalonia/bin/publish/win-x64/Tools

      - name: Build rotom.exe
        uses: ./.github/actions/build-rotom
        with:
          output-directory: DSPRE.Avalonia/bin/publish/win-x64/Tools

      - name: Build chatot
        uses: ./.github/actions/build-chatot
        with:
          output-directory: DSPRE.Avalonia/bin/publish/win-x64/Tools

      - name: Bundle Databases
        run: |
          mkdir "DSPRE.Avalonia/bin/publish/win-x64/databases"
          robocopy databases "DSPRE.Avalonia/bin/publish/win-x64/databases" /E /XD .git .github /XF .gitmodules
          if ($LASTEXITCODE -le 7) { exit 0 } else { exit 1 }

      - name: Zip Windows build
        run: Compress-Archive -Path "DSPRE.Avalonia/bin/publish/win-x64/*" -DestinationPath DSPRE-Avalonia-win-x64-canary.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: dspre-avalonia-win-x64
          path: DSPRE-Avalonia-win-x64-canary.zip

  build-linux:
    if: github.repository == 'DS-Pokemon-Rom-Editor/DSPRE'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          # Avalonia 12 needs a newer compiler than SDK 8 has; the 8 runtime runs the net8.0 app and tests.
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Clone Database Repository
        run: git clone https://github.com/DS-Pokemon-Rom-Editor/scrcmd-database.git databases

      - name: Clone ds-rom Repository
        run: git clone --depth 1 https://github.com/DS-Pokemon-Rom-Editor/ds-rom.git ds-rom

      - name: Publish DSPRE.Avalonia (linux-x64)
        run: dotnet publish DSPRE.Avalonia/DSPRE.Avalonia.csproj -p:PublishProfile=linux-x64

      - name: Build dsrom (Linux)
        run: |
          cargo build --release -p ds-rom-cli --manifest-path ds-rom/Cargo.toml
          mkdir -p DSPRE.Avalonia/bin/publish/linux-x64/Tools
          cp ds-rom/target/release/dsrom DSPRE.Avalonia/bin/publish/linux-x64/Tools/dsrom
          chmod +x DSPRE.Avalonia/bin/publish/linux-x64/Tools/dsrom

      - name: Build apicula (Linux)
        uses: ./.github/actions/build-apicula
        with:
          output-directory: DSPRE.Avalonia/bin/publish/linux-x64/Tools

      - name: Build rotom (Linux)
        uses: ./.github/actions/build-rotom
        with:
          output-directory: DSPRE.Avalonia/bin/publish/linux-x64/Tools

      - name: Build chatot
        uses: ./.github/actions/build-chatot
        with:
          output-directory: DSPRE.Avalonia/bin/publish/linux-x64/Tools

      # TODO: same known gap as base-build-nightly.yaml - drop the remaining Linux tool binaries
      # into Tools/ with these exact names (no extension): ndstool, blz.

      - name: Bundle Databases
        run: |
          mkdir -p DSPRE.Avalonia/bin/publish/linux-x64/databases
          rsync -a --exclude='.git' --exclude='.github' --exclude='.gitmodules' databases/ DSPRE.Avalonia/bin/publish/linux-x64/databases/

      - name: Make executable
        run: chmod +x DSPRE.Avalonia/bin/publish/linux-x64/DSPRE.Avalonia

      - name: Archive Linux build
        run: tar -C DSPRE.Avalonia/bin/publish/linux-x64 -czf DSPRE-Avalonia-linux-x64-canary.tar.gz .

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: dspre-avalonia-linux-x64
          path: DSPRE-Avalonia-linux-x64-canary.tar.gz

  # Experimental: a failure here doesn't hold back the Windows and Linux release.
  build-macos:
    if: github.repository == 'DS-Pokemon-Rom-Editor/DSPRE'
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: osx-arm64
            runner: macos-latest
          - rid: osx-x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          # Avalonia 12 needs a newer compiler than SDK 8 has; the 8 runtime runs the net8.0 app.
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Clone Database Repository
        run: git clone https://github.com/DS-Pokemon-Rom-Editor/scrcmd-database.git databases

      - name: Clone ds-rom Repository
        run: git clone --depth 1 https://github.com/DS-Pokemon-Rom-Editor/ds-rom.git ds-rom

      - name: Publish DSPRE.Avalonia (${{ matrix.rid }})
        run: dotnet publish DSPRE.Avalonia/DSPRE.Avalonia.csproj -p:PublishProfile=${{ matrix.rid }}

      - name: Build dsrom (macOS)
        run: |
          cargo build --release -p ds-rom-cli --manifest-path ds-rom/Cargo.toml
          mkdir -p DSPRE.Avalonia/bin/publish/${{ matrix.rid }}/Tools
          cp ds-rom/target/release/dsrom DSPRE.Avalonia/bin/publish/${{ matrix.rid }}/Tools/dsrom
          chmod +x DSPRE.Avalonia/bin/publish/${{ matrix.rid }}/Tools/dsrom

      - name: Build apicula (macOS)
        uses: ./.github/actions/build-apicula
        with:
          output-directory: DSPRE.Avalonia/bin/publish/${{ matrix.rid }}/Tools

      - name: Build rotom (macOS)
        uses: ./.github/actions/build-rotom
        with:
          output-directory: DSPRE.Avalonia/bin/publish/${{ matrix.rid }}/Tools

      - name: Build chatot
        uses: ./.github/actions/build-chatot
        with:
          output-directory: DSPRE.Avalonia/bin/publish/${{ matrix.rid }}/Tools

      # No ndstool or blz step: DSPRE on macOS refuses projects in the older ndstool layout.

      - name: Bundle Databases
        run: |
          mkdir -p DSPRE.Avalonia/bin/publish/${{ matrix.rid }}/databases
          rsync -a --exclude='.git' --exclude='.github' --exclude='.gitmodules' databases/ DSPRE.Avalonia/bin/publish/${{ matrix.rid }}/databases/

      - name: Make executable
        run: chmod +x DSPRE.Avalonia/bin/publish/${{ matrix.rid }}/DSPRE.Avalonia

      - name: Archive macOS build
        run: tar -C DSPRE.Avalonia/bin/publish/${{ matrix.rid }} -czf DSPRE-Avalonia-${{ matrix.rid }}-canary.tar.gz .

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: dspre-avalonia-${{ matrix.rid }}
          path: DSPRE-Avalonia-${{ matrix.rid }}-canary.tar.gz

  release:
    if: ${{ always() && github.repository == 'DS-Pokemon-Rom-Editor/DSPRE' && needs.build-windows.result == 'success' && needs.build-linux.result == 'success' }}
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: dspre-avalonia-win-x64

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: dspre-avalonia-linux-x64

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: dspre-avalonia-osx-*
          merge-multiple: true

      - name: Fetch tags
        run: git fetch --prune --unshallow --tags

      - name: Delete previous release
        run: |
          gh release delete --yes canary-avalonia || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update canary-avalonia tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f canary-avalonia -m "Avalonia canary build for commit ${{ github.sha }}"
          git push -f origin canary-avalonia

      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Create new release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: canary-avalonia
          name: DSPRE Avalonia Canary Build ${{ steps.date.outputs.date }} (${{ github.sha }})
          files: |
            DSPRE-Avalonia-win-x64-canary.zip
            DSPRE-Avalonia-linux-x64-canary.tar.gz
            DSPRE-Avalonia-osx-arm64-canary.tar.gz
            DSPRE-Avalonia-osx-x64-canary.tar.gz
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            ## ⚠️ Avalonia Canary Build Notice ⚠️
            This is a Canary Build of the pure Avalonia DSPRE shell (no WinForms), automatically
            generated from the latest push to `feature/avalonia`. Windows and Linux, both
            self-contained. This is the in-progress cross-platform shell; expect missing features,
            rough edges, and instability.

            ## 🍎 macOS (experimental)
            `osx-arm64` is for Apple Silicon, `osx-x64` for Intel Macs. These builds are untested. They
            aren't signed, so after extracting, run `xattr -dr com.apple.quarantine` on the folder, then
            start `DSPRE.Avalonia`. Porting older projects isn't supported on macOS yet.

            ## 🚧 What does this mean?
            This build reflects ongoing development on the Avalonia migration and is not a stable
            release. Features may be incomplete, subject to change, or cause unexpected issues.

            ## 💡 Who is this for?
            Developers and testers tracking the Avalonia migration who want to try the cross-platform
            shell as it develops. If you're looking for a reliable version, use the latest Stable
            Release instead.
          prerelease: true
          generate_release_notes: true
